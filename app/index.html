<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>가구 스킨 스튜디오</title>
<style>/*__CSS__*/</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span>가구 스킨 스튜디오</span></div>
    <div class="file-meta" id="fileMeta"></div>
    <div class="top-actions">
      <button class="btn ghost" data-action="open-library" type="button">재질·색 관리</button>
      <button class="btn" data-action="open-file" type="button">GLB 열기</button>
      <input type="file" id="fileInput" accept=".glb,model/gltf-binary" hidden>
    </div>
  </header>

  <main class="layout">
    <section class="stage" id="stage">
      <div class="viewport" id="viewport"></div>
      <div class="stage-tools" id="stageTools" hidden>
        <div class="seg" role="group" aria-label="보기">
          <button type="button" data-action="view" data-view="material" class="on">재질 보기</button>
          <button type="button" data-action="view" data-view="parts">부분 보기</button>
        </div>
        <button class="btn ghost small" type="button" data-action="reset-view">시점 처음으로</button>
      </div>
      <div class="legend" id="legend" hidden></div>
      <div class="tip" id="tip" hidden></div>
      <div class="drop" id="drop">
        <div class="drop-card">
          <div class="drop-icon" aria-hidden="true"></div>
          <h1>가구 GLB 파일을 여기로 끌어다 놓으세요</h1>
          <p>3DAISTUDIO에서 받은 .glb 파일을 그대로 쓰면 돼요. 파일은 이 컴퓨터 안에서만 처리되고 인터넷으로 보내지지 않아요.</p>
          <button class="btn" data-action="open-file" type="button">파일 고르기</button>
        </div>
      </div>
      <div class="busy" id="busy" hidden>
        <div class="busy-card">
          <div class="spinner" aria-hidden="true"></div>
          <div class="busy-text" id="busyText">처리 중</div>
          <div class="bar"><span id="busyBar"></span></div>
        </div>
      </div>
    </section>

    <aside class="panel" id="panel">
      <section class="card" id="secInfo"></section>
      <section class="card" id="secParts"></section>
      <section class="card" id="secMaterial"></section>
      <section class="card" id="secExport"></section>
      <footer class="foot">버전 <span id="version"></span> · 인터넷 없이 동작해요</footer>
    </aside>
  </main>
</div>

<dialog class="dialog wide" id="photoDialog">
  <form method="dialog" class="dialog-body" id="photoForm">
    <header class="dialog-head">
      <h2>사진으로 재질 만들기</h2>
      <button class="icon-btn" value="cancel" aria-label="닫기" type="submit">×</button>
    </header>
    <div class="photo-grid">
      <div class="photo-preview">
        <div class="photo-drop" id="photoDrop">
          <canvas id="photoCanvas" width="512" height="512"></canvas>
          <div class="photo-empty" id="photoEmpty">
            <p>대리석·나무·원단 사진을 끌어다 놓거나</p>
            <button class="btn small" type="button" data-action="photo-pick">사진 고르기</button>
            <input type="file" id="photoInput" accept="image/*" hidden>
          </div>
        </div>
        <p class="note">이음매가 보이는지 확인할 수 있게 같은 무늬를 2×2로 이어 붙여 보여줘요.</p>
      </div>
      <div class="photo-form" id="photoFields"></div>
    </div>
    <footer class="dialog-foot">
      <span class="note" id="photoStatus"></span>
      <button class="btn ghost" value="cancel" type="submit">취소</button>
      <button class="btn" type="button" data-action="photo-save" id="photoSave" disabled>저장하고 쓰기</button>
    </footer>
  </form>
</dialog>

<dialog class="dialog" id="libraryDialog">
  <form method="dialog" class="dialog-body" id="libraryForm">
    <header class="dialog-head">
      <h2>재질·색 관리</h2>
      <button class="icon-btn" value="cancel" aria-label="닫기" type="submit">×</button>
    </header>
    <div id="libraryBody"></div>
    <footer class="dialog-foot">
      <span class="note">다른 PC로 옮길 때는 내보낸 .zip 파일을 그 PC에서 가져오면 돼요.</span>
      <button class="btn ghost" type="button" data-action="lib-import">가져오기</button>
      <button class="btn" type="button" data-action="lib-export">내보내기 (.zip)</button>
      <input type="file" id="libInput" accept=".zip" hidden>
    </footer>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script type="text/plain" id="worker-src">/*__WORKER__*/</script>
<script type="application/json" id="library-data">/*__LIBRARY__*/</script>
<script>/*__MAIN__*/</script>
</body>
</html>
